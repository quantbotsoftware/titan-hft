[package]
name = "titan-indicators"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
titan-types = { path = "../titan-types" }
serde = { version = "1.0", features = ["derive"] }
rayon = "1"
ndarray = "0.15"
tracing = "0.1"

[dev-dependencies]
proptest = "1.11.0"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "bench_oracle"
harness = false

[[bench]]
name = "bench_indicators"
harness = false
