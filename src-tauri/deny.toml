[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # Tauri 1.x transitive deps -- unmaintained gtk-rs GTK3 bindings
    # Will be resolved when migrating to Tauri 2.x (uses gtk4)
    { id = "RUSTSEC-2024-0411", reason = "tauri 1.x dep: atk" },
    { id = "RUSTSEC-2024-0412", reason = "tauri 1.x dep: cairo-rs" },
    { id = "RUSTSEC-2024-0413", reason = "tauri 1.x dep: gdk" },
    { id = "RUSTSEC-2024-0414", reason = "tauri 1.x dep: gdk-pixbuf" },
    { id = "RUSTSEC-2024-0415", reason = "tauri 1.x dep: gio" },
    { id = "RUSTSEC-2024-0416", reason = "tauri 1.x dep: glib" },
    { id = "RUSTSEC-2024-0418", reason = "tauri 1.x dep: gtk" },
    { id = "RUSTSEC-2024-0419", reason = "tauri 1.x dep: javascriptcore-rs" },
    { id = "RUSTSEC-2024-0420", reason = "tauri 1.x dep: pango" },
    # Tauri 1.x transitive deps -- other unmaintained
    { id = "RUSTSEC-2024-0384", reason = "tauri 1.x dep: instant (unmaintained)" },
    { id = "RUSTSEC-2024-0436", reason = "tauri 1.x dep: paste (unmaintained)" },
    { id = "RUSTSEC-2024-0370", reason = "tauri 1.x dep: proc-macro-error (unmaintained)" },
    { id = "RUSTSEC-2025-0134", reason = "tauri 1.x dep: rustls-pemfile (unmaintained)" },
    { id = "RUSTSEC-2025-0057", reason = "tauri 1.x dep: fxhash (unmaintained)" },
    # dotenv -- we use it only at startup for .env loading, no security impact
    { id = "RUSTSEC-2021-0141", reason = "dotenv unmaintained, startup-only usage, no security risk" },
    # tar/bytes vulnerabilities -- transitive deps from tauri build pipeline
    { id = "RUSTSEC-2026-0067", reason = "tar: transitive dep from tauri, not used in our code paths" },
    { id = "RUSTSEC-2026-0068", reason = "tar: transitive dep from tauri, not used in our code paths" },
    { id = "RUSTSEC-2026-0009", reason = "bytes BytesMut::reserve overflow: reqwest transitive, not exploitable in our usage" },
    { id = "RUSTSEC-2026-0007", reason = "regex: DoS via stack exhaustion, not user-facing regex in our app" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
